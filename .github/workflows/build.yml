name: Jar bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Bauen
        run: gradle build --no-configuration-cache

      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: crosshair-editor-jar
          path: build/libs/*.jar
